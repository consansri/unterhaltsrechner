name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ubuntu-latest ships Chrome, which the Karma browser tests use.
      - name: Test
        run: ./gradlew :composeApp:jvmTest :composeApp:jsBrowserTest :composeApp:wasmJsBrowserTest

      # Wasm build with automatic fallback to the JS build for browsers without Wasm GC.
      - name: Build web distribution
        run: ./gradlew :composeApp:composeCompatibilityBrowserDistribution

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: composeApp/build/dist/composeWebCompatibility/productionExecutable

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
